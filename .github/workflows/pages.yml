name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install
      - name: Check treatment calculations
        run: bun run test:unit
      - name: Build website
        run: bun run build
        env:
          GITHUB_PAGES_BASE: /rehab/
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist
      - name: Publish website through GitHub Pages API
        id: deployment
        uses: actions/github-script@v7
        with:
          script: |
            const repo = { owner: context.repo.owner, repo: context.repo.repo };
            let artifact;
            for (let attempt = 0; attempt < 12; attempt++) {
              const { data } = await github.rest.actions.listWorkflowRunArtifacts({
                ...repo,
                run_id: context.runId
              });
              artifact = data.artifacts.find(item => item.name === 'github-pages');
              if (artifact) break;
              await new Promise(resolve => setTimeout(resolve, 5000));
            }
            if (!artifact) throw new Error('Uploaded website is not available.');
            const idToken = await core.getIDToken();
            core.setSecret(idToken);
            const { data: deployment } = await github.request('POST /repos/{owner}/{repo}/pages/deployments', {
              ...repo,
              artifact_id: artifact.id,
              pages_build_version: context.sha,
              oidc_token: idToken
            });
            core.setOutput('page_url', deployment.page_url || 'https://lunachen26.github.io/rehab/');
            for (let attempt = 0; attempt < 60; attempt++) {
              const { data } = await github.request('GET /repos/{owner}/{repo}/pages/deployments/{deployment_id}', {
                ...repo,
                deployment_id: deployment.id
              });
              core.info(`Pages deployment: ${data.status}`);
              if (data.status === 'succeed') return;
              if (['failed', 'cancelled', 'deployment_failed'].includes(data.status)) {
                throw new Error(`Pages deployment ${data.status}`);
              }
              await new Promise(resolve => setTimeout(resolve, 5000));
            }
            throw new Error('Timed out waiting for Pages deployment.');
